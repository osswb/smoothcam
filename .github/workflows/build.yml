name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        run: |
          BASE=$(grep -oP 'val baseVersion = "\K[^"]+' app/build.gradle.kts)
          VERSION="$BASE.$GITHUB_RUN_NUMBER"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building SmoothCam $VERSION (build $GITHUB_RUN_NUMBER)"

      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/smoothcam.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/smoothcam.jks" >> "$GITHUB_ENV"
            echo "Signing with the permanent SmoothCam key."
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret is missing: this APK uses a throwaway key and cannot update an installed SmoothCam."
          fi

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "SmoothCam-$VERSION.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmoothCam-${{ env.VERSION }}-build-${{ github.run_number }}
          path: SmoothCam-${{ env.VERSION }}.apk

      # Every build is its own release (tag v0.5.7, v0.5.8, ...), matching the app's version name,
      # so update checkers such as Obtainium see each new build.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove the old unversioned release, if it's still there.
          gh release delete latest --yes --cleanup-tag || true
          NOTES="SmoothCam $VERSION (commit ${GITHUB_SHA::7})

          $(git log -1 --pretty=%B)"
          gh release create "v$VERSION" "SmoothCam-$VERSION.apk" --title "SmoothCam $VERSION" --notes "$NOTES" --latest
