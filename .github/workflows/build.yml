name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building SmoothCam $VERSION (build $GITHUB_RUN_NUMBER)"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "SmoothCam-$VERSION.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmoothCam-${{ env.VERSION }}-build-${{ github.run_number }}
          path: SmoothCam-${{ env.VERSION }}.apk

      # One release per version (tag v0.5, v0.6, ...). Rebuilding the same version replaces its APK.
      # github.com/osswb/smoothcam/releases/latest always points to the newest one.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          NOTES="SmoothCam $VERSION (build $GITHUB_RUN_NUMBER, commit ${GITHUB_SHA::7})

          $(git log -1 --pretty=%B)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "SmoothCam-$VERSION.apk" --clobber
            gh release edit "$TAG" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "SmoothCam-$VERSION.apk" --title "SmoothCam $VERSION" --notes "$NOTES" --latest
          fi
