name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk SmoothCam.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmoothCam-apk
          path: SmoothCam.apk

      # Publishes the APK on the repo's Releases page so you can tap-to-download it on your phone.
      - name: "Publish to Releases (tag: latest)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SmoothCam.apk \
            --title "SmoothCam (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download SmoothCam.apk on your Pixel and open it to install."
